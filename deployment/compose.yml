services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/aquanusa.db
      AQUANUSA_DEVICE_KEY: ${AQUANUSA_DEVICE_KEY}
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      COOKIE_SECURE: "true"
      INITIAL_DEVICE_UID: AQUANUSA-001
      AQUANUSA_ADMIN_NAME: ${AQUANUSA_ADMIN_NAME}
      AQUANUSA_ADMIN_EMAIL: ${AQUANUSA_ADMIN_EMAIL}
      AQUANUSA_ADMIN_PASSWORD: ${AQUANUSA_ADMIN_PASSWORD}
      AQUANUSA_USER_NAME: ${AQUANUSA_USER_NAME}
      AQUANUSA_USER_EMAIL: ${AQUANUSA_USER_EMAIL}
      AQUANUSA_USER_PASSWORD: ${AQUANUSA_USER_PASSWORD}
    volumes:
      - aquanusa-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  aquanusa-data:
